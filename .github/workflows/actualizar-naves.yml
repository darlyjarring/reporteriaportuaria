name: Actualizar itinerario DP World

on:
  workflow_dispatch:
  schedule:
    # Cada 10 minutos. GitHub Actions puede retrasar ligeramente los cron programados.
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Consultar DP World y generar datos.json
        run: python actualizar_naves.py

      - name: Guardar datos.json en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          if git diff --cached --quiet; then
            echo "No hubo cambios en los datos."
          else
            git commit -m "Actualizar itinerario DP World"
            git push
          fi
